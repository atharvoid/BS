<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f2ebdd" />
    <!-- Theme before first paint: the visitor's stored choice, else the system
         setting. Runs before any CSS so there is no flash of the wrong theme. -->
    <script>
      (function () {
        var theme = 'light'
        try {
          theme = localStorage.getItem('bs-theme') ||
            (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        } catch (e) {}
        document.documentElement.dataset.theme = theme
        if (theme === 'dark') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#14110d')
      })()
    </script>
    <!--
      The hero's headline is set in two Fraunces faces, roman and italic, both
      above the fold on every page. With `font-display: swap` the browser paints
      the fallback and re-lays the words out when each arrives; the italic lands
      about 25 ms after the roman, so the title re-breaks twice. Asking for both
      while the stylesheet is still parsing removes the second reflow rather
      than hiding it.

      Only these two are preloaded. The lede's Newsreader face and the mono face
      are not above the fold on the pages that use them, and preloading five
      faces would delay the render that matters.
    -->
    <link
      rel="preload"
      href="/fonts/fraunces-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin="anonymous"
    />
    <link
      rel="preload"
      href="/fonts/fraunces-italic.woff2"
      as="font"
      type="font/woff2"
      crossorigin="anonymous"
    />
